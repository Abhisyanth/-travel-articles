{% load static %}

<!DOCTYPE html>
<html>

    <title>{{data.title}}</title>
    <link rel="stylesheet" href="{% static 'css/read.css' %}">
</head>

    <div class="read-container">

        <div class="read-card">

            <div class="read-content">

                

                <h1>{{data.title}}</h1>

                <p class="read-description">
                    {{data.desc}}
                </p>

            </div>

        </div>

    </div>

</body>
</html>
