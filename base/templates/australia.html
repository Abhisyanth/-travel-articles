{% extends 'main.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/australia.css' %}">

<div class="australia-container">

    {% for i in data3 %}

    <div class="australia-card">

        <img src="{{i.pic}}" alt="{{i.title}}">

        <h2 class="australia-title">{{i.title}}</h2>

        <p class="australia-description">
            {{i.desc|truncatewords:5}}...
        </p>

        <a href="{% url 'read' i.id %}" class="australia-read-more">
            Read More
        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
