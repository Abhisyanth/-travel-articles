{% extends 'main.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/africa.css' %}">

<div class="africa-container">

    {% for i in data5 %}

    <div class="africa-card">

        <img src="{{i.pic}}" alt="{{i.title}}">

        <p class="africa-number">#{{i.id}}</p>

        <h2 class="africa-title">{{i.title}}</h2>

        <p class="africa-description">
            {{i.desc|truncatewords:5}}...
        </p>

        <a href="{% url 'read' i.id %}" class="africa-read-more">
            Read More
        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
