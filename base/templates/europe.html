{% extends 'main.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/europe.css' %}">

<div class="europe-container">

    {% for i in data2 %}

    <div class="europe-card">

        <img src="{{i.pic}}" alt="{{i.title}}">

        <h2 class="europe-title">{{i.title}}</h2>

        <p class="europe-description">
            {{i.desc|truncatewords:5}}...
        </p>

        <a href="{% url 'read' i.id %}" class="europe-read-more">
            Read More
        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
