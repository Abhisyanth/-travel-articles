{% extends 'main.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/asia.css' %}">

<div class="home-content">

    {% for i in data %}

    <div class="article-card">

        <img src="{{i.pic}}" alt="{{i.title}}">

        <h2>{{i.title}}</h2>

        <p class="article-description">
            {{i.desc|truncatewords:5}}...
        </p>

        <a href="{% url 'read' i.id %}" class="read-more">
            Read More
        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
